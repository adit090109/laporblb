<!DOCTYPE html>
<html lang="id" class="dark no-transition">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Biznet Jadwal">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Biznet Blimbing - Jadwal Installer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: oklch(0.98 0.005 260);
      --foreground: oklch(0.13 0.02 260);
      --card: oklch(1 0 0);
      --card-foreground: oklch(0.13 0.02 260);
      --primary: oklch(0.55 0.2 260);
      --primary-foreground: oklch(0.98 0 0);
      --secondary: oklch(0.95 0.01 260);
      --secondary-foreground: oklch(0.3 0.02 260);
      --muted: oklch(0.95 0.01 260);
      --muted-foreground: oklch(0.5 0.02 260);
      --destructive: oklch(0.55 0.22 25);
      --destructive-foreground: oklch(0.98 0 0);
      --success: oklch(0.65 0.2 155);
      --success-foreground: oklch(0.98 0 0);
      --warning: oklch(0.75 0.15 75);
      --warning-foreground: oklch(0.2 0.02 75);
      --border: oklch(0.9 0.01 260);
      --input: oklch(0.93 0.01 260);
      --ring: oklch(0.55 0.2 260);
      --radius: 0.75rem;
    }

    .dark {
      --background: oklch(0.1 0.02 260);
      --foreground: oklch(0.95 0.01 260);
      --card: oklch(0.14 0.02 260);
      --card-foreground: oklch(0.95 0.01 260);
      --primary: oklch(0.65 0.2 260);
      --primary-foreground: oklch(0.1 0.02 260);
      --secondary: oklch(0.2 0.02 260);
      --secondary-foreground: oklch(0.9 0.01 260);
      --muted: oklch(0.2 0.02 260);
      --muted-foreground: oklch(0.6 0.02 260);
      --destructive: oklch(0.6 0.22 25);
      --destructive-foreground: oklch(0.98 0 0);
      --success: oklch(0.7 0.2 155);
      --success-foreground: oklch(0.1 0.02 155);
      --warning: oklch(0.8 0.15 75);
      --warning-foreground: oklch(0.2 0.02 75);
      --border: oklch(0.25 0.02 260);
      --input: oklch(0.18 0.02 260);
      --ring: oklch(0.65 0.2 260);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      border-color: var(--border);
    }

    html,
    html *,
    html *::before,
    html *::after {
      transition: background-color 0.3s ease, 
                  border-color 0.3s ease, 
                  color 0.2s ease,
                  box-shadow 0.3s ease,
                  fill 0.3s ease,
                  stroke 0.3s ease;
    }

    html.no-transition,
    html.no-transition *,
    html.no-transition *::before,
    html.no-transition *::after {
      transition: none !important;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--background);
      color: var(--foreground);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(20px);
      background-color: color-mix(in oklch, var(--card) 80%, transparent);
      border-bottom: 1px solid var(--border);
    }

    .header-content {
      max-width: 640px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-link {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .logo-wrapper {
      position: relative;
    }

.logo-icon {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  }
  
  .logo-icon img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  }

    .logo-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 12px;
      height: 12px;
      background-color: var(--success);
      border-radius: 50%;
      border: 2px solid var(--card);
    }

    .logo-text h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .logo-text p {
      font-size: 12px;
      color: var(--muted-foreground);
    }

    /* Theme Toggle */
    .theme-toggle {
      position: relative;
      width: 56px;
      height: 28px;
      border-radius: 9999px;
      background-color: var(--secondary);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .theme-toggle:hover {
      background-color: var(--muted);
    }

    .theme-toggle-knob {
      position: absolute;
      top: 4px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background-color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: left 0.3s ease;
    }

    .dark .theme-toggle-knob {
      left: 4px;
    }

    html:not(.dark) .theme-toggle-knob {
      left: 32px;
    }

    .theme-toggle-knob svg {
      width: 12px;
      height: 12px;
      color: var(--primary-foreground);
    }

    /* Main */
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Section */
    section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title svg {
      width: 16px;
      height: 16px;
      color: var(--primary);
    }

    .section-title.success svg {
      color: var(--success);
    }

    .section-title h2 {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted-foreground);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: var(--radius);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      outline: none;
    }

    .btn:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
    }

    .btn-sm {
      height: 28px;
      padding: 0 10px;
      font-size: 12px;
    }

    .btn-sm svg {
      width: 12px;
      height: 12px;
    }

    .btn-md {
      height: 44px;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-md svg {
      width: 16px;
      height: 16px;
    }

    .btn-primary {
      background-color: var(--primary);
      color: var(--primary-foreground);
    }

    .btn-primary:hover {
      background-color: color-mix(in oklch, var(--primary) 90%, black);
    }

    .btn-outline {
      background-color: transparent;
      color: var(--foreground);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      background-color: var(--muted);
    }

    .btn-ghost {
      background-color: transparent;
      color: var(--muted-foreground);
    }

    .btn-ghost:hover {
      background-color: var(--muted);
    }

    .btn-destructive {
      color: var(--destructive);
    }

    .btn-destructive:hover {
      background-color: color-mix(in oklch, var(--destructive) 10%, transparent);
    }

    .btn-whatsapp {
      background-color: #25D366;
      color: white;
    }

    .btn-whatsapp:hover {
      background-color: #20BD5A;
    }

    .btn-full {
      width: 100%;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    /* Textarea */
    textarea {
      width: 100%;
      min-height: 140px;
      padding: 16px;
      border-radius: 12px;
      background-color: var(--card);
      border: 1px solid var(--border);
      color: var(--foreground);
      font-size: 14px;
      font-family: 'JetBrains Mono', monospace;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: color-mix(in oklch, var(--primary) 50%, transparent);
      box-shadow: 0 0 0 4px color-mix(in oklch, var(--primary) 20%, transparent);
    }

    textarea::placeholder {
      color: color-mix(in oklch, var(--muted-foreground) 50%, transparent);
    }

    /* Input */
    input[type="text"] {
      height: 36px;
      padding: 0 12px;
      border-radius: calc(var(--radius) - 2px);
      background-color: var(--input);
      border: 1px solid var(--border);
      color: var(--foreground);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    input[type="text"]:focus {
      border-color: color-mix(in oklch, var(--primary) 50%, transparent);
      box-shadow: 0 0 0 4px color-mix(in oklch, var(--primary) 20%, transparent);
    }

    input[type="text"]::placeholder {
      color: var(--muted-foreground);
    }

    /* Schedule Card */
    .schedule-card {
      position: relative;
      width: 100%;
      text-align: left;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background-color: var(--card);
      cursor: pointer;
      transition: all 0.2s;
      overflow: hidden;
    }

    .schedule-card:hover {
      border-color: color-mix(in oklch, var(--primary) 30%, transparent);
      background-color: color-mix(in oklch, var(--card) 80%, transparent);
    }

    .schedule-card.selected {
      background-color: color-mix(in oklch, var(--primary) 10%, transparent);
      border-color: color-mix(in oklch, var(--primary) 50%, transparent);
      box-shadow: 0 0 0 4px color-mix(in oklch, var(--primary) 20%, transparent);
    }

    .schedule-card .accent-bar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      border-radius: 12px 0 0 12px;
      background-color: color-mix(in oklch, var(--primary) 50%, transparent);
      transition: background-color 0.2s;
    }

    .schedule-card:hover .accent-bar,
    .schedule-card.selected .accent-bar {
      background-color: var(--primary);
    }

    .schedule-card-content {
      padding-left: 12px;
    }

    .schedule-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .wo-tag {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--primary);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 500;
      border: 1px solid;
    }

    .badge svg {
      width: 12px;
      height: 12px;
    }

    .badge-success {
      background-color: color-mix(in oklch, var(--success) 10%, transparent);
      color: var(--success);
      border-color: color-mix(in oklch, var(--success) 20%, transparent);
    }

    .badge-warning {
      background-color: color-mix(in oklch, var(--warning) 10%, transparent);
      color: var(--warning);
      border-color: color-mix(in oklch, var(--warning) 20%, transparent);
    }

    .badge-destructive {
      background-color: color-mix(in oklch, var(--destructive) 10%, transparent);
      color: var(--destructive);
      border-color: color-mix(in oklch, var(--destructive) 20%, transparent);
    }

    .schedule-card-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 4px;
    }

    .schedule-card-row svg {
      width: 16px;
      height: 16px;
      color: var(--muted-foreground);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .schedule-card-row .name {
      font-weight: 500;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--foreground);
    }

    .schedule-card-row .address {
      font-size: 12px;
      color: var(--muted-foreground);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Form Panel */
    .form-panel {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      display: none;
      flex-direction: column;
      gap: 20px;
      animation: slideUp 0.3s ease;
    }

    .form-panel.show {
      display: flex;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .form-panel-header svg {
      width: 16px;
      height: 16px;
      color: var(--primary);
    }

    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-row {
      display: grid;
      gap: 12px;
    }

    .form-row-2 {
      grid-template-columns: 1fr 1fr;
    }

    .form-row-3 {
      grid-template-columns: 1fr 1fr 1fr;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted-foreground);
    }

    /* Toggle Buttons */
    .toggle-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .toggle-btn {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--secondary);
      color: var(--muted-foreground);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn:hover {
      border-color: color-mix(in oklch, var(--primary) 30%, transparent);
    }

    .toggle-btn.active {
      background-color: color-mix(in oklch, var(--primary) 10%, transparent);
      border-color: var(--primary);
      color: var(--primary);
    }

    .installer-group {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .installer-btn {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--secondary);
      color: var(--muted-foreground);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .installer-btn:hover {
      border-color: color-mix(in oklch, var(--primary) 30%, transparent);
    }

    .installer-btn.active {
      background-color: color-mix(in oklch, var(--primary) 10%, transparent);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Result Section */
    .result-section {
      display: none;
      flex-direction: column;
      gap: 12px;
      animation: slideUp 0.3s ease;
    }

    .result-section.show {
      display: flex;
    }

    .result-container {
      position: relative;
    }

    .result-container textarea {
      min-height: 300px;
    }

    .copy-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 8px;
      border-radius: 8px;
      background-color: var(--secondary);
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .copy-btn:hover {
      background-color: var(--muted);
    }

    .copy-btn svg {
      width: 16px;
      height: 16px;
      color: var(--muted-foreground);
    }

    /* Divider */
    .divider {
      height: 1px;
      background-color: var(--border);
    }

    /* History Card */
    .history-card {
      position: relative;
      width: 100%;
      text-align: left;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background-color: var(--card);
      cursor: pointer;
      transition: all 0.2s;
      overflow: hidden;
    }

    .history-card:hover {
      border-color: color-mix(in oklch, var(--success) 30%, transparent);
    }

    .history-card .accent-bar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      border-radius: 12px 0 0 12px;
      background-color: color-mix(in oklch, var(--success) 50%, transparent);
      transition: background-color 0.2s;
    }

    .history-card:hover .accent-bar {
      background-color: var(--success);
    }

    .history-card-content {
      padding-left: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .history-card-info {
      flex: 1;
      min-width: 0;
    }

    .history-timestamp {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .history-timestamp svg {
      width: 12px;
      height: 12px;
      color: var(--muted-foreground);
    }

    .history-timestamp span {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted-foreground);
    }

    .history-name {
      font-weight: 500;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
      color: var(--foreground);
    }

    .history-details {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted-foreground);
    }

    .history-details svg {
      width: 12px;
      height: 12px;
    }

    .history-details .dot {
      color: var(--border);
    }

    .history-card-arrow {
      flex-shrink: 0;
    }

    .history-card-arrow svg {
      width: 16px;
      height: 16px;
      color: var(--muted-foreground);
      transition: color 0.2s;
    }

    .history-card:hover .history-card-arrow svg {
      color: var(--success);
    }

    /* Empty State */
    .empty-state {
      padding: 32px;
      border-radius: 12px;
      border: 1px dashed var(--border);
      text-align: center;
    }

    .empty-state svg {
      width: 32px;
      height: 32px;
      color: color-mix(in oklch, var(--muted-foreground) 50%, transparent);
      margin: 0 auto 8px;
    }

    .empty-state p {
      font-size: 14px;
      color: var(--muted-foreground);
    }

    .empty-state .sub {
      font-size: 12px;
      color: color-mix(in oklch, var(--muted-foreground) 70%, transparent);
      margin-top: 4px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      padding: 12px 20px;
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.3);
      font-size: 14px;
      font-weight: 500;
      z-index: 100;
      opacity: 0;
      transition: all 0.3s ease;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Data List Container */
    .data-list {
      display: none;
      flex-direction: column;
      gap: 8px;
      animation: slideUp 0.3s ease;
    }

    .data-list.show {
      display: flex;
    }

    /* Hide section initially */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-content">
      <a href="https://app.biznet.id/" target="_blank" rel="noopener noreferrer" class="logo-link">
        <div class="logo-wrapper">
<div class="logo-icon">
  <img src="https://biznethome.net/custom-upload/logo/Logo%20MyBiznet.png" alt="Biznet Logo">
  </div>
          <div class="logo-badge"></div>
        </div>
        <div class="logo-text">
          <h1>Biznet Blimbing</h1>
          <p>Jadwal Installer</p>
        </div>
      </a>

      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <div class="theme-toggle-knob">
          <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </div>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main>

    const KODE_DP_PREFIX = ["APD","BLB","BNL","CKN","LSP","MDP","MGL","PDW","PWJ","PWT","SWJ"];

    function findKodeDP(text) {
      const candidates = text.match(/\b([A-Z]{2,4}\d{6,8})\b/g) || [];
      for (const c of candidates) {
        if (KODE_DP_DB.has(c)) return { kode: c, valid: true };
      }
      for (const c of candidates) {
        if (KODE_DP_PREFIX.some(p => c.startsWith(p))) return { kode: c, valid: false };
      }
      return null;
    }

    // State
    let parsedData = [];
    let selectedData = null;
    let selectedIndex = -1;
    let dpMode = 1;
    let selectedInstallers = [];
    let historyData = [];

    // Load history from localStorage
    function loadHistory() {
      try {
        const saved = localStorage.getItem('biznet_history');
        if (saved) {
          historyData = JSON.parse(saved);
          renderHistory();
        }
      } catch (e) {
        console.error('Error loading history:', e);
      }
    }

    // Save history to localStorage
    function saveHistory() {
      try {
        localStorage.setItem('biznet_history', JSON.stringify(historyData));
      } catch (e) {
        console.error('Error saving history:', e);
      }
    }

    // Theme functions
    function initTheme() {
      const stored = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const shouldBeDark = stored ? stored === 'dark' : prefersDark;
      
      document.documentElement.classList.toggle('dark', shouldBeDark);
      updateThemeIcon(shouldBeDark);
      
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          document.documentElement.classList.remove('no-transition');
        });
      });
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateThemeIcon(isDark);
    }

    function updateThemeIcon(isDark) {
      const moonIcon = document.querySelector('.moon-icon');
      const sunIcon = document.querySelector('.sun-icon');
      if (isDark) {
        moonIcon.style.display = 'block';
        sunIcon.style.display = 'none';
      } else {
        moonIcon.style.display = 'none';
        sunIcon.style.display = 'block';
      }
    }

    // Toast function
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // Parse function
    function parseScheduleData(text) {
      const blocks = text
        .split(/\n(?=\d+\.\s)/)
        .filter(b => /^\d+\.\s/.test(b.trim()));

      return blocks.map((block, i) => {
        const lines = block.trim().split("\n").map(x => x.trim()).filter(Boolean);
        let firstLine = lines[0] || "";
        firstLine = firstLine.replace(/^\d+\.\s*/, "");

        const normalizedFirst = firstLine.replace(/(?<!\d)\s*\/\s*(?!\d)/g, " - ");
        const parts = normalizedFirst.split(/\s+-\s+/).map(x => x.trim()).filter(Boolean);

        const reHP = /^(\+62|62|08)[\d\s\-]+$/;
        const reHPInline = /(\+62[\d\s\-]+|08[\d\s\-]+)/g;
        const reLayanan = /\b(home|modem|olt)\b/i;
        const reLayananCapture = /\bhome\s+[0-9oOdD\+\s]+/i;
        const reModem = /\b(BUY|RENT|SECOND)\b/i;
        const reReq = /(\*?(?:req\s+)?jam\s+[\d\.:]+|\*?req\s+jam)/i;
        const reNoise = /^(\*|-|no\s+atribut|no\s+atribute|atribut|atribute|\s*)$/i;
        
        const reJunkPart = (p) => {
          if (reReq.test(p)) return true;
          if (reNoise.test(p)) return true;
          if (/^[\*\-\s]+$/.test(p)) return true;
          if (/^no\s+(atribut|atribute)$/i.test(p.trim())) return true;
          return false;
        };

        let nama = null;
        const hp = [];
        const alamat = [];
        let layananPart = null;
        let layanan = null;
        let req = null;

        parts.forEach(part => {
          const multiHP = part.split(/\s*\/\s*/).map(x => x.trim());
          const allHP = multiHP.filter(x => reHP.test(x));
          if (allHP.length > 0) {
            hp.push(...allHP);
            return;
          }

          if (reLayanan.test(part)) {
            layananPart = part;
            return;
          }

          if (reReq.test(part)) {
            req = part;
            return;
          }

          if (reJunkPart(part)) return;

          if (!nama && !/\d{4,}/.test(part) && part.length > 1 && part.length < 60) {
            nama = part;
            return;
          }

          const cleanPart = part.replace(/[\*]+/g, "").replace(/\s*-\s*$/, "").trim();
          if (cleanPart) alamat.push(cleanPart);
        });

        if (!nama) nama = parts[0] || "-";

        let alamatStr = alamat
          .filter(a => !reJunkPart(a))
          .join(", ")
          .replace(/,\s*,/g, ",")
          .replace(/^,\s*|,\s*$/g, "")
          .trim() || "-";

        if (hp.length === 0) {
          const found = firstLine.match(reHPInline) || [];
          hp.push(...found.map(x => x.trim()));
        }
        const hpStr = hp.join(" / ") || "-";

        let modem = "-";
        if (layananPart) {
          const mMatch = layananPart.match(reModem);
          if (mMatch) modem = mMatch[1].toUpperCase();

          const lMatch = layananPart.match(reLayananCapture) || layananPart.match(/\bolt\s+\d+d/i);
          if (lMatch) {
            layanan = lMatch[0].trim();
          } else {
            layanan = layananPart
              .replace(/\bmodem\b/i, "")
              .replace(reModem, "")
              .replace(/[\*\-]+/g, "")
              .replace(/\s+/g, " ")
              .trim();
          }

          if (!layanan) {
            layanan = "-";
          }
        }
        if (modem === "-" && layananPart) {
          const mMatch2 = (layananPart + " " + firstLine).match(reModem);
          if (mMatch2) modem = mMatch2[1].toUpperCase();
        }
        if (layanan === null) layanan = "-";

        const allLinks = block.match(/https?:\/\/[^\s)]+/g) || [];

        let tikorSalesName = "-";
        let tikorLineIdx = -1;
        for (let li = 0; li < lines.length; li++) {
          if (/tikor|titik\s*koor/i.test(lines[li])) {
            tikorLineIdx = li;
            break;
          }
        }

        let tikor = "-";
        if (tikorLineIdx >= 0) {
          const tikorLine = lines[tikorLineIdx];
          const linkInLine = tikorLine.match(/https?:\/\/[^\s)]+/);
          if (linkInLine) {
            tikor = linkInLine[0];
          } else {
            for (let li = tikorLineIdx + 1; li < lines.length && li <= tikorLineIdx + 2; li++) {
              const linkInNext = lines[li].match(/https?:\/\/[^\s)]+/);
              if (linkInNext) {
                tikor = linkInNext[0];
                break;
              }
            }
          }

          for (let li = tikorLineIdx; li < Math.min(tikorLineIdx + 3, lines.length); li++) {
            const salesM = lines[li].match(/https?:\/\/[^\s)]+\s*\(\s*([^)]+?)\s*\)/);
            if (salesM) {
              tikorSalesName = salesM[1].trim();
              break;
            }
          }
        }

        if (tikor === "-" && allLinks.length > 0) {
          tikor = allLinks[0];
        }

        if (tikorSalesName === "-") {
          const salesM = block.match(/https?:\/\/[^\s)]+\s*\(\s*([^)]+?)\s*\)/);
          if (salesM) tikorSalesName = salesM[1].trim();
        }

        const dpLineMatch = block.match(/(?:titik|pin)\s*dp\s*[:\-]?\s*(\d+)\s*M\s*\(\s*([A-Z0-9]+)\s*\)/i);
        let panjang = "-";
        let kode_dp = "-";
        let kode_dp_valid = true;
        let titikDpLink = "-";

        if (dpLineMatch) {
          panjang = dpLineMatch[1] + "M";
          const rawKode = dpLineMatch[2].toUpperCase();
          const found = findKodeDP(rawKode);
          kode_dp = rawKode;
          kode_dp_valid = found ? found.valid : KODE_DP_PREFIX.some(p => rawKode.startsWith(p));
        } else {
          const pM = block.match(/(?:titik|pin)\s*dp[^:]*:\s*(\d+)\s*M/i);
          if (pM) panjang = pM[1] + "M";
          const dpFound = findKodeDP(block.toUpperCase());
          if (dpFound) {
            kode_dp = dpFound.kode;
            kode_dp_valid = dpFound.valid;
          }
        }

        let dpLineIdx = -1;
        for (let li = 0; li < lines.length; li++) {
          if (/(?:titik|pin)\s*dp/i.test(lines[li])) {
            dpLineIdx = li;
            break;
          }
        }
        if (dpLineIdx >= 0) {
          for (let li = dpLineIdx; li < Math.min(dpLineIdx + 3, lines.length); li++) {
            const linkInDP = lines[li].match(/https?:\/\/[^\s)]+/);
            if (linkInDP && linkInDP[0] !== tikor) {
              titikDpLink = linkInDP[0];
              break;
            }
          }
        }
        if (titikDpLink === "-") {
          for (const lnk of allLinks) {
            if (lnk !== tikor) {
              titikDpLink = lnk;
              break;
            }
          }
        }

        if (alamatStr === "-") {
          for (let li = 1; li < lines.length; li++) {
            if (/\b(jl|jln|jalan|perum|gang|gg|rt|rw|blok|no\.?|nomor)\b/i.test(lines[li])
              && !(/tikor|titik|pin\s*dp|https?:/i.test(lines[li]))) {
              alamatStr = lines[li];
              break;
            }
          }
        }

        return {
          nama: nama || "-",
          alamat: alamatStr,
          hp: hpStr,
          modem: modem,
          sales: tikorSalesName,
          tikor: tikor,
          titik_dp_link: titikDpLink,
          kode_dp: kode_dp,
          kode_dp_valid: kode_dp_valid,
          layanan: layanan,
          panjang: panjang,
          req: req || "-",
          index: i + 1
        };
      });
    }

    function parseData() {
      const text = document.getElementById('inputText').value;
      if (!text.trim()) {
        showToast('Paste jadwal terlebih dahulu');
        return;
      }

      parsedData = parseScheduleData(text);
      if (parsedData.length === 0) {
        showToast('Tidak ada data terdeteksi');
        return;
      }

      selectedData = null;
      selectedIndex = -1;
      document.getElementById('resultSection').classList.remove('show');
      document.getElementById('formPanel').classList.remove('show');
      
      renderParsedData();
      showToast(`${parsedData.length} jadwal ditemukan`);
    }

    function renderParsedData() {
      const section = document.getElementById('parsedSection');
      const list = document.getElementById('dataList');
      const count = document.getElementById('parseCount');

      count.textContent = parsedData.length;
      section.classList.remove('hidden');
      list.classList.add('show');

      list.innerHTML = parsedData.map((data, i) => `
        <button class="schedule-card ${selectedIndex === i ? 'selected' : ''}" onclick="selectData(${i})">
          <div class="accent-bar"></div>
          <div class="schedule-card-content">
            <div class="schedule-card-header">
              <span class="wo-tag">WO #${data.index}</span>
              ${data.kode_dp !== '-' ? (
                data.kode_dp_valid ? `
                  <span class="badge badge-success">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                    ${data.kode_dp}
                  </span>
                ` : `
                  <span class="badge badge-warning">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                    ${data.kode_dp}
                  </span>
                `
              ) : `
                <span class="badge badge-destructive">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                  No DP Code
                </span>
              `}
            </div>
            <div class="schedule-card-row">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <span class="name">${data.nama}</span>
            </div>
            <div class="schedule-card-row">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
              <span class="address">${data.alamat}</span>
            </div>
          </div>
        </button>
      `).join('');
    }

    function selectData(index) {
      selectedData = parsedData[index];
      selectedIndex = index;
      
      // Update card selection
      renderParsedData();
      
      // Reset form
      document.getElementById('inputWo').value = '';
      document.getElementById('inputBrim').value = '';
      document.getElementById('inputSn').value = '';
      document.getElementById('inputModem').value = selectedData.modem !== '-' ? selectedData.modem : '';
      document.getElementById('inputDpReal').value = '';
      document.getElementById('inputPort').value = '';
      document.getElementById('inputOutput').value = '';
      document.getElementById('inputRedaman').value = '';
      
      setDpMode(1);
      selectedInstallers = [];
      document.querySelectorAll('.installer-btn').forEach(btn => btn.classList.remove('active'));
      
      // Show form
      const formPanel = document.getElementById('formPanel');
      formPanel.classList.add('show');
      
      setTimeout(() => {
        formPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
    }

    function setDpMode(mode) {
      dpMode = mode;
      document.getElementById('dpMode1').classList.toggle('active', mode === 1);
      document.getElementById('dpMode2').classList.toggle('active', mode === 2);
      document.getElementById('inputDpReal').style.display = mode === 2 ? 'block' : 'none';
    }

    function toggleInstaller(btn) {
      const name = btn.dataset.name;
      btn.classList.toggle('active');
      
      if (selectedInstallers.includes(name)) {
        selectedInstallers = selectedInstallers.filter(n => n !== name);
      } else {
        selectedInstallers.push(name);
      }
    }

    function generateReport() {
      if (!selectedData) {
        showToast('Pilih data terlebih dahulu');
        return;
      }

      const wo = document.getElementById('inputWo').value || '-';
      const brim = document.getElementById('inputBrim').value || '-';
      const sn = document.getElementById('inputSn').value || '-';
      const modem = document.getElementById('inputModem').value || '-';
      const dpReal = dpMode === 1 ? selectedData.kode_dp : (document.getElementById('inputDpReal').value || '-');
      const port = document.getElementById('inputPort').value;
      const portVal = port ? `16/${port}` : '16/-';
      const output = document.getElementById('inputOutput').value || '-';
      const redaman = document.getElementById('inputRedaman').value || '-';
      const installerList = selectedInstallers.length ? selectedInstallers.join('-') : '-';

      const today = new Date().toLocaleDateString('id-ID');

      const result = `DONE ***
${today}

NAMA : ${selectedData.nama}
ALAMAT : ${selectedData.alamat}
Tikor Pelanggan : ${selectedData.tikor}

NOMORPIC : ${selectedData.hp}
SALES : ${selectedData.sales}
WO : ${wo}
BRIM ID : ${brim}
MODEM SN : ${sn}

Modem BUY / RENT : ${modem}
LAYANAN : ${selectedData.layanan}
KODE DP WO : ${selectedData.kode_dp}
KODE DP REAL : ${dpReal}
PORT YANG DIINSTAL : ${portVal}
OUTPUT DP : ${output}
REDAMAN ONT DISISTEM ONT : ${redaman}
PANJANG TARIKAN : ${selectedData.panjang}
NAMA INSTALLER : ${installerList}

TERIMAKASIH BRACH BLIMBING`;

      document.getElementById('resultText').value = result;
      
      // Show result section
      const resultSection = document.getElementById('resultSection');
      resultSection.classList.add('show');
      
      // Add to history
      const historyEntry = {
        id: Date.now(),
        timestamp: new Date().toLocaleString('id-ID'),
        fullText: result,
        detail: {
          nama: selectedData.nama,
          wo: wo,
          installer: installerList
        }
      };
      historyData.unshift(historyEntry);
      if (historyData.length > 50) historyData = historyData.slice(0, 50);
      saveHistory();
      renderHistory();

      showToast('Laporan berhasil dibuat');
      
      setTimeout(() => {
        resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
    }

    function sendWhatsApp() {
      const text = document.getElementById('resultText').value;
      if (!text.trim()) {
        showToast('Belum ada hasil untuk dikirim');
        return;
      }
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    function copyResult() {
      const text = document.getElementById('resultText').value;
      if (!text.trim()) {
        showToast('Belum ada hasil untuk disalin');
        return;
      }
      navigator.clipboard.writeText(text);
      showToast('Disalin ke clipboard');
    }

    function renderHistory() {
      const emptyState = document.getElementById('historyEmpty');
      const list = document.getElementById('historyList');
      const clearBtn = document.getElementById('clearHistoryBtn');

      if (historyData.length === 0) {
        emptyState.style.display = 'block';
        list.classList.remove('show');
        clearBtn.classList.add('hidden');
        return;
      }

      emptyState.style.display = 'none';
      list.classList.add('show');
      clearBtn.classList.remove('hidden');

      list.innerHTML = historyData.map((entry, i) => `
        <button class="history-card" onclick="viewHistory(${i})">
          <div class="accent-bar"></div>
          <div class="history-card-content">
            <div class="history-card-info">
              <div class="history-timestamp">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span>${entry.timestamp}</span>
              </div>
              <div class="history-name">${entry.detail.nama}</div>
              <div class="history-details">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>${entry.detail.installer || '-'}</span>
                <span class="dot">&#8226;</span>
                <span>WO: ${entry.detail.wo || '-'}</span>
              </div>
            </div>
            <div class="history-card-arrow">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
          </div>
        </button>
      `).join('');
    }

    function viewHistory(index) {
      const entry = historyData[index];
      if (entry) {
        document.getElementById('resultText').value = entry.fullText;
        const resultSection = document.getElementById('resultSection');
        resultSection.classList.add('show');
        resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function clearHistory() {
      if (confirm('Hapus semua riwayat?')) {
        historyData = [];
        saveHistory();
        renderHistory();
        showToast('Riwayat dihapus');
      }
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      loadHistory();
    });

    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((registration) => {
            console.log('SW registered:', registration.scope);
          })
          .catch((error) => {
            console.log('SW registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
